name: Cypress E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    
    container: cypress/browsers:node-20.11.0-chrome-121.0.6167.85-1-ff-122.0-edge-121.0.2277.128-1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install Dependencies
        run: yarn install

      - name: Run Cypress Tests
        uses: cypress-io/github-action@v6
        with:
          # Start the RWA app (frontend + backend)
          start: yarn dev
          # Wait for the frontend to be ready before running tests
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 120
          # Run tests in Chrome
          browser: chrome
        env:
          # Pass your specific configuration to Cypress
          CYPRESS_BASE_URL: http://localhost:3000
          CYPRESS_API_URL: http://localhost:3002

      # CRITICAL: Upload artifacts (screenshots/videos) if tests fail
      - name: Upload Screenshots on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 7

      - name: Upload Videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: cypress/videos
          retention-days: 7