name: Cypress E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout YOUR repository (contains the tests)
      - name: Checkout Your Test Repository
        uses: actions/checkout@v4

      # 2. Checkout the actual Real World App repository
      - name: Checkout RWA Application
        uses: actions/checkout@v4
        with:
          repository: cypress-io/cypress-realworld-app
          path: rwa-app

      # 3. Inject your tests and config into the RWA app folder
      - name: Copy Your Tests into the RWA App
        run: |
          cp -r cypress rwa-app/
          rm -f rwa-app/cypress.config.ts
          cp cypress.config.js rwa-app/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Yarn
        run: npm install -g yarn

      # 4. Install dependencies for the RWA app
      - name: Install RWA Dependencies
        working-directory: ./rwa-app
        run: yarn install

      # 5. Start the app and run the tests
      - name: Run Cypress Tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./rwa-app
          start: yarn dev
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 120
          browser: chrome
        env:
          CYPRESS_BASE_URL: http://localhost:3000
          CYPRESS_API_URL: http://localhost:3002

      # 6. Upload artifacts for debugging
      - name: Upload Screenshots on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: rwa-app/cypress/screenshots
          retention-days: 7

      - name: Upload Videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: rwa-app/cypress/videos
          retention-days: 7